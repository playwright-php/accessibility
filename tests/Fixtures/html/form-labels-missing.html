<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Labels Missing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        form div {
            margin: 1rem 0;
        }
        input, select, textarea {
            display: block;
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
    <main>
        <h1>Form Without Labels</h1>

        <section>
            <h2>Violation Examples</h2>
            <form>
                <!-- Input without label -->
                <div>
                    <input type="text" name="username" placeholder="Username">
                </div>

                <!-- Input without associated label -->
                <div>
                    <span>Email:</span>
                    <input type="email" name="email">
                </div>

                <!-- Select without label -->
                <div>
                    <select name="country">
                        <option value="">Select country</option>
                        <option value="us">United States</option>
                        <option value="uk">United Kingdom</option>
                    </select>
                </div>

                <!-- Textarea without label -->
                <div>
                    <textarea name="comments" placeholder="Your comments"></textarea>
                </div>

                <!-- Button is ok without label, but for consistency in testing -->
                <button type="submit">Submit</button>
            </form>
        </section>

        <section>
            <h2>Correct Example</h2>
            <form>
                <div>
                    <label for="proper-name">Name:</label>
                    <input type="text" id="proper-name" name="proper-name">
                </div>

                <div>
                    <label for="proper-email">Email:</label>
                    <input type="email" id="proper-email" name="proper-email">
                </div>

                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
</body>
</html>
